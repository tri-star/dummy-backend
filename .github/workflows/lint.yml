name: Lint

on:
  pull_request:
    paths:
      - 'src/**'
      - 'serverless.ts'
      - 'package-lock.json'
      - '.eslintrc.cjs'
      - '.prettierrc.cjs'
      - 'tsconfig.json'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'serverless.ts'
      - 'package-lock.json'
      - '.eslintrc.cjs'
      - '.prettierrc.cjs'
      - 'tsconfig.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Node.jsをセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm dependenciesをインストール
      - name: Install npm dependencies
        run: npm ci

      # npm run lintを実行
      - name: Run npm lint
        run: npm run lint

      # Terraform CLIをセットアップ
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Terraformフォーマットチェック
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform

      # Terraform Lintチェック
      - name: Terraform Lint Check
        run: terraform validate
        working-directory: ./terraform
